name: Release - Build & Attach Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Attach Firmware Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware for ESP32-C3 & ESP32-S3
        run: |
          pio run -e esp32-c3
          pio run -e esp32-s3
          mv .pio/build/esp32-c3/firmware.bin firmware-esp32-c3.bin
          mv .pio/build/esp32-s3/firmware.bin firmware-esp32-s3.bin

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-esp32-c3.bin
            firmware-esp32-s3.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}